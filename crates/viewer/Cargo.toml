[package]
name = "viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Named differently from the lib so the wasm32 cdylib keeps the name `viewer.wasm`.
# `cargo run -p viewer -- model.mdx` still works: it is the only binary.
[[bin]]
name = "viewer-native"
path = "src/main.rs"

[dependencies]
blp = { path = "../blp" }
mdx = { path = "../mdx" }
mpq = { path = "../mpq" }
w3map = { path = "../w3map" }
gamedata = { path = "../gamedata" }
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2.0.21"
winit = "0.30.13"
# "webgl" enables the WebGL2 fallback on wasm32; it is inert on native.
wgpu = { version = "30.0.1", features = ["webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
# PNG output of the offscreen renderer (zlib and CRC only; the image is written by hand).
flate2 = "1.1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["console", "HtmlCanvasElement", "HtmlElement", "CssStyleDeclaration"] }
